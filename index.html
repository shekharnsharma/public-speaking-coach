    function stopBreathe() {
      breatheRunning = false;
      if (breatheTimer) { clearInterval(breatheTimer); breatheTimer = 0; }
    }
    function breathePhaseClass(phase) {
      return ["", "in", "hold-in", "out", "hold-out"][Math.max(0, phase)] || "";
    }
    function breatheNames(phase) {
      const names = ["Ready", "Inhale", "Hold", "Exhale", "Hold"];
      return phase < 0 ? names[0] : names[phase];
    }
    function startBreathe() {
      stopBreathe();
      breatheRunning = true;
      breatheRound = 1;
      breathePhase = 1;
      breatheCount = 4;
      render();
      breatheTimer = setInterval(() => {
        if (!breatheRunning) return;
        breatheCount -= 1;
        let phaseChanged = false;
        if (breatheCount <= 0) {
          breathePhase += 1;
          if (breathePhase > 4) {
            breathePhase = 1;
            breatheRound += 1;
            if (breatheRound > 3) {
              stopBreathe();
              breathePhase = -1;
              render();
              return;
            }
          }
          breatheCount = 4;
          phaseChanged = true;
        }
        const countEl = document.querySelector(".breathe-count");
        const labEl = document.querySelector(".breathe-label");
        const boxEl = document.querySelector(".breathe-box");
        const stEl = document.querySelector(".breathe-stage .status");
        if (countEl) countEl.textContent = String(breatheCount);
        if (labEl) {
          const lab = breatheNames(breathePhase);
          labEl.textContent = lab;
        }
        if (boxEl && phaseChanged) boxEl.className = "breathe-box " + breathePhaseClass(breathePhase);
        if (stEl) stEl.textContent = "Round " + breatheRound + " of 3";
      }, 1000);
    }

    async function requestWakeLock() {
      try {
        if (drive && drive.wakeLock && drive.wakeLock.released === false) return;
        if (navigator.wakeLock && navigator.wakeLock.request) {
          const lock = await navigator.wakeLock.request("screen");
          if (drive) {
            drive.wakeLock = lock;
            lock.addEventListener("release", () => {});
          }
        }
      } catch (e) {}
    }
    function releaseWakeLock() {
      try {
        if (drive && drive.wakeLock) drive.wakeLock.release();
      } catch (e) {}
      if (drive) drive.wakeLock = null;
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function buildDriveQueue() {
      const items = [];
      const dayI = currentDayIndex();
      const les = LESSONS[dayI] || LESSONS[0];
      items.push({ type: "intro" });
      items.push({ type: "breathe", rounds: 2 });
      const tips = [
        les.tip,
        "Open with a short welcome, then three points: safety, plan, and a shout-out or quality. Close strong.",
        "If you feel a filler word coming, close your mouth and pause instead.",
        "Project your voice to the back of the group. Finish every word.",
        "Pause after numbers, path names, and your opening line."
      ];
      const prompts = [
        AFE_PROMPTS.find((p) => p.id === "full-startup") || AFE_PROMPTS[0],
        AFE_PROMPTS.find((p) => p.id === "safety-hands"),
        AFE_PROMPTS.find((p) => p.id === "plan-cpt"),
        AFE_PROMPTS.find((p) => p.id === "shout-quality"),
        IMPROMPTU[2],
        IMPROMPTU[5],
        IMPROMPTU[Math.floor(Math.random() * IMPROMPTU.length)]
      ].filter(Boolean);

      const sections = scriptSections(state.myScript);
      if (sections.length) {
        sections.slice(0, 2).forEach((sec, i) => {
          prompts.splice(1 + i, 0, {
            id: "script-" + i,
            title: "Your start-up, part " + (i + 1),
            text: "I'll read part " + (i + 1) + " of your start-up. Then you say it back. Here it is: " + sec,
            speakExtra: sec,
            hint: ""
          });
        });
      }
      const hasAnn = todaysEvents().length || todaysShoutouts().length || comingUpEvents().length || (state.personalTouch || "").trim();
      if (hasAnn) {
        const daily = dailyAnnouncementScript();
        prompts.unshift({
          id: "announce-today",
          title: "Today's announcements",
          text: "Here's today's announcement. Listen, then repeat it in your own words, with the same warmth. " + daily,
          hint: "Speak to your team, not at them. Use we and us. Thank them for real."
        });
        tips.unshift("Speak to your team, not at them. Use we and us. Thank them for real.");
      }
      if (prompts.length > 8) prompts.length = 8;

      const usedTips = tips.slice(0, Math.min(tips.length, prompts.length));
      prompts.forEach((p, i) => {
        items.push({
          type: "drill",
          tip: usedTips[i] || tips[tips.length - 1],
          prompt: p,
          seconds: 60
        });
      });
      items.push({ type: "close" });
      return items;
    }

    function setDriveStep(text, sub) {
      if (!drive) return;
      drive.stepText = text;
      drive.stepSub = sub || "";
      if (screen === "drive") {
        const el = document.querySelector(".drive-step");
        if (el) {
          el.innerHTML = escapeHtml(text) + (sub ? `<span class="drive-sub">${escapeHtml(sub)}</span>` : "");
        } else {
          render();
        }
      }
    }

    async function waitWhilePaused() {
      while (drive && drive.running && drive.paused) {
        await sleep(120);
      }
    }

    function speakLine(text) {
      if (!drive || !drive.running) return Promise.resolve();
      drive.currentSpeak = text;
      return new Promise(async (resolve) => {
        let tries = 0;
        while (drive && drive.running && tries < 8) {
          await waitWhilePaused();
          if (!drive || !drive.running) return resolve();
          const result = await new Promise((res) => {
            stopSpeech();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = "en-US";
            const voice = preferVoice();
            if (voice) u.voice = voice;
            u.rate = 0.95;
            u.pitch = 1;
            let settled = false;
            const finish = (why) => {
              if (settled) return;
              settled = true;
              if (drive) drive._cancelSpeak = null;
              res(why);
            };
            if (drive) {
              drive._cancelSpeak = () => {
                try { speechSynthesis.cancel(); } catch (e) {}
                finish("pause");
              };
            }
            u.onend = () => finish("end");
            u.onerror = () => finish(drive && drive.paused ? "pause" : "error");
            try { speechSynthesis.speak(u); } catch (e) { finish("error"); }
          });
          if (result === "end") return resolve();
          if (result === "pause") { tries += 1; continue; }
          return resolve();
        }
        resolve();
      });
    }

    async function timedWait(ms, opts) {
      const start = Date.now();
      let pausedFor = 0;
      let pauseAt = 0;
      drive.earlyEnd = false;
      while (drive && drive.running) {
        if (drive.paused) {
          if (!pauseAt) pauseAt = Date.now();
          await sleep(100);
          continue;
        }
        if (pauseAt) {
          pausedFor += Date.now() - pauseAt;
          pauseAt = 0;
        }
        const gone = Date.now() - start - pausedFor;
        const remain = Math.max(0, ms - gone);
        if (opts && opts.onTick) opts.onTick(remain);
        if (opts && opts.shouldEnd && opts.shouldEnd()) return "early";
        if (gone >= ms) return "timeout";
        await sleep(100);
      }
      return "stop";
    }

    async function runDriveSession() {
      const items = buildDriveQueue();
      drive = {
        running: true,
        paused: false,
        items: items,
        index: 0,
        stepText: "Starting",
        stepSub: "Starting",
        sessionStats: [],
        wakeLock: null,
        currentSpeak: "",
        _cancelSpeak: null,
        earlyEnd: false
      };
      screen = "drive";
      render();
      requestWakeLock();

      const go = async () => {
        for (let i = 0; i < items.length; i++) {
          if (!drive || !drive.running) return;
          drive.index = i;
          const item = items[i];
          if (item.type === "intro") {
            setDriveStep("Welcome", "Drive Mode");
            await speakLine("Welcome to Drive Mode. Keep your eyes on the road. I will coach you by voice. First, a short breathing exercise. Then several one-minute speaking drills. I'll tell you when to talk, and when to rest.");
          } else if (item.type === "breathe") {
            setDriveStep("Box breathing");
            await speakLine("Let's do box breathing for two rounds. I will count. Inhale for four, hold for four, exhale for four, hold for four.");
            const names = ["Inhale", "Hold", "Exhale", "Hold"];
            for (let r = 1; r <= (item.rounds || 2); r++) {
              for (let p = 0; p < 4; p++) {
                if (!drive.running) return;
                setDriveStep(names[p] + " · round " + r, "Box breathing");
                await speakLine(names[p] + ". Two. Three. Four.");
              }
            }
            await speakLine("Nice. Shoulders down. Let's begin the speaking practice.");
          } else if (item.type === "drill") {
            setDriveStep("Listen to the tip");
            await speakLine("Here's a short tip. " + item.tip);
            setDriveStep("Your prompt");
            await speakLine("Here is your prompt. " + item.prompt.text);
            setDriveStep("Ready…");
            await speakLine("Ready. Go. I'll be quiet while you speak.");
            if (!drive.running) return;
            liveTranscript = "";
            finalTranscript = "";
            speechEvents = [];
            speakStartedAt = Date.now();
            speakEndedAt = 0;
            lastSpeechAt = 0;
            const startedTalking = { on: false };
            startRecognition(() => {
              if (lastSpeechAt) startedTalking.on = true;
            });
            const secs = item.seconds || 60;
            setDriveStep("Speak", "Speak · " + secs + "s");
            await timedWait(secs * 1000, {
              onTick: (remain) => {
                setDriveStep("Speak", "Speak · " + Math.ceil(remain / 1000) + "s");
              },
              shouldEnd: () => {
                if (!srSupported) return false;
                if (!startedTalking.on) return false;
                return lastSpeechAt && (Date.now() - lastSpeechAt > 4000);
              }
            });
            speakEndedAt = Date.now();
            stopRecognition();
            const st = srSupported ? computeStats() : null;
            if (st) drive.sessionStats.push(st);
            logSession({
              type: "drive",
              kind: "drive",
              duration: st ? st.duration : secs,
              wpm: st && st.hasSpeech ? st.wpm : 0,
              fillers: st && st.hasSpeech ? st.fillers : null,
              words: (st && st.words) || 0,
              confidence: 0,
              checks: {},
              promptId: item.prompt && item.prompt.id
            });
            if (LESSONS[currentDayIndex()]) {
              // don't auto-complete all days; mark current if first drill
            }
            setDriveStep("Feedback");
            if (st && st.hasSpeech) await speakLine(feedbackSpeech(st));
            else await speakLine("Time's up. Nice work. I couldn't score every word this time, but you finished the drill. The next one is coming.");
          } else if (item.type === "close") {
            if (!state.guidedDone) { state.guidedDone = true; }
            markDayDone(currentDayIndex());
            setDriveStep("You're done");
            await speakLine("That's the end of this Drive Mode session. You practiced several start-ups and a breathing exercise. Your progress is saved. Arrive safely, and I'll be ready next time.");
          }
        }
        if (drive) drive.running = false;
        releaseWakeLock();
        stopRecognition();
        stopSpeech();
        screen = "drive-done";
        render();
      };

      go().catch(() => {
        if (drive) drive.running = false;
        releaseWakeLock();
        stopRecognition();
        stopSpeech();
        screen = "drive-done";
        render();
      });
    }

    function driveEntry() {
      const seen = localStorage.getItem(DRIVE_NOTICE_KEY) === "1";
      if (seen) startDrive();
      else {
        screen = "drive-notice";
        render();
      }
    }
    function startDrive() {
      try { localStorage.setItem(DRIVE_NOTICE_KEY, "1"); } catch (e) {}
      stopAllSoft();
      runDriveSession();
    }
    function toggleDrivePause() {
      if (!drive || !drive.running) return;
      drive.paused = !drive.paused;
      if (drive.paused) {
        if (drive._cancelSpeak) drive._cancelSpeak();
        try { speechSynthesis.cancel(); } catch (e) {}
        setDriveStep("Paused");
      } else {
        requestWakeLock();
      }
      render();
    }
    function endDrive() {
      if (drive) drive.running = false;
      if (drive && drive._cancelSpeak) drive._cancelSpeak();
      stopSpeech();
      stopRecognition();
      releaseWakeLock();
      screen = "drive-done";
      render();
    }

    function goHome() {
      stopAllSoft();
      if (drive) { drive.running = false; releaseWakeLock(); }
      screen = "home";
      render();
    }

    document.getElementById("app").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn) {
        if (screen === "drive" && drive && drive.running) {
          e.preventDefault();
          toggleDrivePause();
        }
        return;
      }
      const act = btn.getAttribute("data-act");
      if (act === "dismiss-install") dismissInstall();
      else if (act === "home") goHome();
      else if (act === "start") startFromHome();
      else if (act === "lessons") { screen = "lessons"; render(); }
      else if (act === "open-lesson") { lessonTrack = "core"; openLesson(Number(btn.getAttribute("data-i"))); }
      else if (act === "lesson-practice") {
        if (lessonTrack === "leadership") {
          const les = LEADERSHIP[lessonIndex];
          announceOverride = "";
          practiceKind = (les && les.drill === "afe") ? "afe" : "impromptu";
          prompt = { title: les.title, text: les.prompt, hint: les.tip };
          remaining = practiceSecs = practiceSecs || 60;
          running = false;
          errorMsg = "";
          clearRecording();
          clearLiveStats();
          reviewChecks = {};
          reviewConf = 0;
          prompterOffset = 0;
          screen = "practice";
          render();
        } else {
          const les = LESSONS[lessonIndex];
          const kind = les && les.drill ? les.drill : "afe";
          openPractice(kind, practiceSecs, true);
        }
      }
      else if (act === "practice-pick") { stopAllSoft(); screen = "practice-pick"; render(); }
      else if (act === "secs") { practiceSecs = Number(btn.getAttribute("data-s")) || 60; render(); }
      else if (act === "pick-kind") openPractice(btn.getAttribute("data-k"), practiceSecs, false);
      else if (act === "timer-start") startTimer();
      else if (act === "timer-stop") finishTimer();
      else if (act === "record") toggleRecord();
      else if (act === "play-me") playMe();
      else if (act === "to-review") goReview();
      else if (act === "back-practice") { screen = "practice"; render(); }
      else if (act === "toggle-check") {
        const c = btn.getAttribute("data-c");
        reviewChecks[c] = !reviewChecks[c];
        render();
      }
      else if (act === "conf") { reviewConf = Number(btn.getAttribute("data-v")); render(); }
      else if (act === "save-review") saveReview();
      else if (act === "script-edit") { scriptDraft = state.myScript || ""; screen = "script"; render(); }
      else if (act === "save-script") {
        const box = document.getElementById("script-box");
        scriptDraft = box ? box.value : scriptDraft;
        state.myScript = scriptDraft;
        saveState();
        render();
      }
      else if (act === "practice-script") {
        const box = document.getElementById("script-box");
        if (box) { scriptDraft = box.value; state.myScript = scriptDraft; saveState(); }
        openPractice("myscript", practiceSecs, false);
      }
      else if (act === "speed") {
        const d = Number(btn.getAttribute("data-d")) || 0;
        state.scrollSpeed = Math.max(12, Math.min(120, (state.scrollSpeed || 40) + d));
        saveState();
        const lbl = document.querySelector(".speed-row .lbl");
        if (lbl) lbl.innerHTML = "Scroll " + state.scrollSpeed + '<span class="en">Speed</span>';
        else render();
      }
      else if (act === "breathe") { stopBreathe(); breathePhase = -1; screen = "breathe"; render(); }
      else if (act === "breathe-start") startBreathe();
      else if (act === "breathe-stop") { stopBreathe(); render(); }
      else if (act === "drive-entry") driveEntry();
      else if (act === "drive-start") startDrive();
      else if (act === "drive-toggle") { e.preventDefault(); e.stopPropagation(); toggleDrivePause(); }

      else if (act === "drive-end") { e.stopPropagation(); endDrive(); }
      else if (act === "leadership") { screen = "leadership"; render(); }
      else if (act === "open-lead") { lessonTrack = "leadership"; lessonIndex = Number(btn.getAttribute("data-i")); screen = "lesson"; render(); }
      else if (act === "take-photo") { document.getElementById("evt-camera").click(); }
      else if (act === "upload-image") { document.getElementById("evt-upload").click(); }
      else if (act === "looks-good") applyBulletinSave();
      else if (act === "bulletin-replace") { bulletinReplace = btn.getAttribute("data-v") === "1"; render(); }
      else if (act === "edit-events") openEventReview();
      else if (act === "edit-event") openAddForm(btn.getAttribute("data-eid"));
      else if (act === "add-event-form") openAddForm();
      else if (act === "add-event") { eventDrafts.push(emptyEvent({ date: todayStr(), source: "manual" })); render(); }
      else if (act === "delete-event") deleteEventDraft(btn.getAttribute("data-eid"));
      else if (act === "save-events") saveEventDrafts();
      else if (act === "save-add") { readAddFormFields(); saveAddForm(); }
      else if (act === "add-type") { readAddFormFields(); addForm.type = btn.getAttribute("data-v"); render(); }
      else if (act === "draft-type") {
        const id = btn.getAttribute("data-eid");
        const ev = eventDrafts.find((x) => x.id === id);
        if (ev) ev.type = btn.getAttribute("data-v");
        render();
      }
      else if (act === "reset-script") {
        const id = btn.getAttribute("data-eid");
        const ev = eventDrafts.find((x) => x.id === id);
        if (ev) ev.scriptCustom = "";
        render();
      }
      else if (act === "add-reset-script") { readAddFormFields(); addForm.scriptCustom = ""; render(); }
      else if (act === "hear-event") { const ev = eventById(btn.getAttribute("data-eid")); if (ev) speakText(getEventScript(ev)); }
      else if (act === "practice-event") { const ev = eventById(btn.getAttribute("data-eid")); if (ev) practiceAnnouncement(getEventScript(ev)); }
      else if (act === "hear-all") speakText(dailyAnnouncementScript());
      else if (act === "practice-all") practiceAnnouncement(dailyAnnouncementScript());
      else if (act === "share-all") shareText(dailyAnnouncementScript());
      else if (act === "add-shout") addShoutFromForm();
      else if (act === "delete-shout") {
        const id = btn.getAttribute("data-sid");
        state.shoutouts = (state.shoutouts || []).filter((s) => s.id !== id);
        saveState();
        render();
      }
      else if (act === "use-prompt") savePersonalTouch(true);
      else if (act === "save-touch") savePersonalTouch(false);
      else if (act === "dismiss-bulletin") dismissBulletinBanner();
    });

    function readAddFormFields() {
      if (!addForm) return;
      const g = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
      addForm.title = g("add-title");
      addForm.date = g("add-date") || todayStr();
      addForm.time = g("add-time");
      addForm.location = g("add-location");
      addForm.notes = g("add-notes");
      addForm.scriptCustom = g("add-script");
    }
    function deleteEventDraft(id) {
      eventDrafts = (eventDrafts || []).filter((e) => e.id !== id);
      render();
    }

    document.getElementById("app").addEventListener("input", (e) => {
      if (!e.target) return;
      if (e.target.id === "script-box") scriptDraft = e.target.value;
      const evField = e.target.getAttribute("data-efield");
      if (evField) {
        const id = e.target.getAttribute("data-eid");
        const ev = (eventDrafts || []).find((x) => x.id === id);
        if (ev) ev[evField] = e.target.value;
      }
      if (e.target.id && e.target.id.indexOf("add-") === 0) readAddFormFields();
      if (e.target.id === "personal-touch") state.personalTouch = e.target.value;
    });

    function bindFileInputs() {
      const cam = document.getElementById("evt-camera");
      const up = document.getElementById("evt-upload");
      const onFiles = (e) => {
        const files = e.target.files;
        e.target.value = "";
        if (files && files.length) processBulletinFiles(files);
      };
      if (cam && !cam._bound) { cam.addEventListener("change", onFiles); cam._bound = true; }
      if (up && !up._bound) { up.addEventListener("change", onFiles); up._bound = true; }
    }
    bindFileInputs();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && screen === "drive" && drive && drive.running && !drive.paused) {
        requestWakeLock();
      }
    });

    function bootFromQuery() {
      try {
        const q = new URLSearchParams(location.search);
        const hash = (location.hash || "").replace(/^#/, "");
        if (q.get("mode") === "drive" || hash === "drive") {
          driveEntry();
          return;
        }
      } catch (e) {}
      render();
    }

    try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
    registerWorker();
    bootFromQuery();

  
  </script>
</body>
</html>
