<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Speaking Coach">
  <meta name="theme-color" content="#0F2F59">
  <meta name="description" content="A practical public speaking coach for AFE start-ups, with a hands-free Drive Mode and event announcements.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Public Speaking Coach</title>
  <style>
    :root {
      --bg: #F6F1E8;
      --ink: #152033;
      --muted: #5C6573;
      --navy: #0F2F59;
      --navy-2: #1A4A86;
      --gold: #C8962E;
      --red: #C4392D;
      --green: #1F7A4D;
      --ok: #2C6BAA;
      --card: #FFFFFF;
      --line: #E6DFD2;
      --shadow: 0 10px 28px rgba(21, 32, 51, 0.08);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans", "Hiragino Sans", system-ui, sans-serif;
    }
    body {
      padding: calc(12px + var(--safe-t)) calc(16px + var(--safe-r)) calc(20px + var(--safe-b)) calc(16px + var(--safe-l));
    }
    button, input, textarea { font: inherit; }
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 18px;
      transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: default; transform: none; }
    .wrap { max-width: 430px; margin: 0 auto; }
    .en {
      display: block;
      font-size: 0.72em;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--muted);
      margin-top: 2px;
    }
    .banner {
      background: var(--navy);
      color: #fff;
      border-radius: 18px;
      padding: 14px 14px 14px 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      box-shadow: var(--shadow);
    }
    .banner p { margin: 0; font-size: 17px; line-height: 1.4; font-weight: 650; }
    .banner .en { color: rgba(255,255,255,0.75); font-weight: 400; font-size: 13px; margin-top: 4px; }
    .banner .x {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 22px;
      line-height: 1;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .ghost {
      background: #fff;
      color: var(--navy);
      border: 2px solid var(--line);
      min-height: 52px;
      padding: 0 16px;
      font-size: 18px;
      font-weight: 700;
      box-shadow: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0 18px;
    }
    .brand img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      color: var(--navy);
      font-weight: 800;
    }
    .lead {
      font-size: 20px;
      line-height: 1.45;
      margin: 0 0 22px;
      font-weight: 650;
    }
    .lead .en { font-weight: 400; font-size: 15px; margin-top: 4px; }
    .start {
      width: 100%;
      min-height: 96px;
      background: var(--red);
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.01em;
      box-shadow: 0 12px 24px rgba(196, 57, 45, 0.28);
      margin-bottom: 16px;
    }
    .start .en { color: rgba(255,255,255,0.85); font-size: 16px; font-weight: 600; }
    .start:active { filter: brightness(0.95); }
    .start.navy {
      background: var(--navy);
      box-shadow: 0 12px 24px rgba(15, 47, 89, 0.28);
    }
    .progress-card, .card {
      background: var(--card);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .progress-label { font-size: 18px; font-weight: 750; margin: 0 0 10px; }
    .bar {
      height: 12px;
      background: #EEE8DC;
      border-radius: 99px;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--navy), var(--navy-2));
      border-radius: 99px;
      width: 0;
    }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 14px 0 8px;
    }
    .stat {
      text-align: center;
      background: #F7F3EB;
      border-radius: 14px;
      padding: 10px 4px;
    }
    .stat b { display: block; font-size: 22px; color: var(--navy); font-weight: 800; }
    .stat span { font-size: 12px; color: var(--muted); font-weight: 650; }
    h2 { font-size: 22px; margin: 8px 0 12px; color: var(--navy); }
    .lesson-btn {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 16px 16px;
      margin-bottom: 10px;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .lesson-btn strong { display: block; font-size: 20px; font-weight: 800; }
    .lesson-btn .meta { font-size: 15px; color: var(--muted); margin-top: 2px; }
    .check {
      width: 36px; height: 36px; border-radius: 50%;
      background: #E8F4EC; color: var(--green);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; flex: 0 0 auto; font-size: 18px;
    }
    .check.empty { background: #F1EEE7; color: #B3AB9E; }
    .step-kicker {
      text-align: center;
      font-size: 18px;
      font-weight: 750;
      color: var(--navy);
      margin: 0 0 8px;
    }
    .phrase, .lesson-body {
      background: var(--card);
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .lesson-body p {
      font-size: 19px;
      line-height: 1.5;
      font-weight: 600;
      margin: 0 0 14px;
    }
    .lesson-body p:last-child { margin-bottom: 0; }
    .lesson-body .en {
      font-weight: 400;
      font-size: 15px;
      line-height: 1.45;
      margin-top: 6px;
    }
    .instr {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      margin: 4px 0 16px;
      line-height: 1.35;
    }
    .btn {
      width: 100%;
      min-height: 72px;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #fff;
    }
    .btn .en { color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 600; }
    .btn-navy { background: var(--navy); }
    .btn-red { background: var(--red); box-shadow: 0 10px 20px rgba(196,57,45,0.22); }
    .btn-green { background: var(--green); }
    .btn-ok { background: var(--ok); }
    .btn-gold { background: var(--gold); color: #1A1406; }
    .btn-gold .en { color: rgba(26,20,6,0.7); }
    .btn.rec-on {
      background: #9B1C1C;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      50% { filter: brightness(1.12); }
    }
    .row-2, .row-3 {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }
    .row-2 { grid-template-columns: 1fr 1fr; }
    .row-3 { grid-template-columns: 1fr 1fr 1fr; }
    .row-2 .btn, .row-3 .btn { min-height: 80px; font-size: 20px; margin: 0; }
    .row-3 .btn { font-size: 18px; padding: 8px 6px; }
    .status {
      text-align: center;
      min-height: 24px;
      font-size: 16px;
      color: var(--muted);
      font-weight: 650;
      margin: 0 0 10px;
    }
    .error { color: var(--red); font-weight: 750; text-align: center; font-size: 17px; margin: 0 0 12px; }
    .next {
      width: 100%;
      min-height: 76px;
      background: var(--navy);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      margin-top: 6px;
    }
    .next .en { color: rgba(255,255,255,0.85); font-size: 15px; }
    .tiny {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      margin-top: 18px;
    }
    .done-card { text-align: center; padding: 28px 18px; }
    .done-card h2 { font-size: 28px; margin-bottom: 8px; }
    .hidden { display: none !important; }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .badge {
      background: #F3E6C4;
      color: #5A3E0B;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 750;
    }
    .badge.off { background: #EEE8DC; color: #9A9488; }
    .chart-wrap { margin-top: 12px; }
    .chart-wrap svg { width: 100%; height: 120px; display: block; }
    .chart-legend {
      display: flex;
      gap: 14px;
      justify-content: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 650;
      margin-top: 4px;
    }
    .dot-navy, .dot-gold {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .dot-navy { background: var(--navy); }
    .dot-gold { background: var(--gold); }
    .timer {
      text-align: center;
      font-size: 84px;
      font-weight: 800;
      line-height: 1;
      color: var(--navy);
      margin: 8px 0 10px;
      font-variant-numeric: tabular-nums;
    }
    .timer.hot { color: var(--red); }
    .prompt-card {
      background: var(--card);
      border-radius: 24px;
      padding: 22px 16px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .prompt-card .kicker {
      font-size: 15px;
      font-weight: 750;
      color: var(--gold);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    .prompt-card .text {
      font-size: 24px;
      line-height: 1.35;
      font-weight: 800;
    }
    .prompt-card .hint {
      margin: 12px 0 0;
      font-size: 17px;
      line-height: 1.4;
      color: var(--navy-2);
      font-weight: 650;
    }
    .chip-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .chip {
      flex: 1;
      min-height: 56px;
      background: #fff;
      color: var(--navy);
      border: 2px solid var(--line);
      font-size: 20px;
      font-weight: 800;
    }
    .chip.on {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }
    .transcript {
      background: #F7F3EB;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 16px;
      line-height: 1.4;
      min-height: 52px;
      margin: 0 0 12px;
      color: var(--ink);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-grid .stat { padding: 12px 8px; }
    .stat-grid .stat b { font-size: 26px; }
    .check-item {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 14px 14px;
      margin-bottom: 8px;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .check-item.on { border-color: var(--green); background: #F1F8F4; }
    .check-item strong { display: block; font-size: 18px; font-weight: 800; }
    .conf-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 8px 0 16px; }
    .conf {
      min-height: 64px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--navy);
      font-size: 24px;
      font-weight: 800;
    }
    .conf.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    textarea.script {
      width: 100%;
      min-height: 180px;
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      font-size: 18px;
      line-height: 1.45;
      resize: vertical;
      background: #fff;
      color: var(--ink);
      margin-bottom: 12px;
    }
    .prompter {
      background: #0B1220;
      color: #F6F1E8;
      border-radius: 22px;
      height: 280px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .prompter .track {
      padding: 120px 18px;
      transition: none;
    }
    .prompter p {
      margin: 0 0 18px;
      font-size: 28px;
      line-height: 1.4;
      font-weight: 750;
      color: rgba(246,241,232,0.4);
    }
    .prompter p.on { color: #fff; }
    .speed-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    .speed-row .lbl { text-align: center; font-weight: 750; font-size: 16px; color: var(--navy); }
    .breathe-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      margin-bottom: 12px;
    }
    .breathe-box {
      width: 180px;
      height: 180px;
      border-radius: 28px;
      border: 6px solid var(--navy);
      background: rgba(15, 47, 89, 0.08);
      transform: scale(0.65);
      transition: transform 4s linear, background 0.3s ease;
    }
    .breathe-box.in { transform: scale(1); background: rgba(15, 47, 89, 0.18); }
    .breathe-box.hold-in { transform: scale(1); }
    .breathe-box.out { transform: scale(0.65); background: rgba(15, 47, 89, 0.06); }
    .breathe-box.hold-out { transform: scale(0.65); }
    .breathe-label {
      margin-top: 22px;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: var(--navy);
    }
    .breathe-count {
      font-size: 48px;
      font-weight: 800;
      color: var(--navy);
      margin-top: 4px;
    }
    .warn {
      background: #F8E8E6;
      border-radius: 22px;
      padding: 20px 16px;
      margin-bottom: 16px;
    }
    .warn p { margin: 0; font-size: 20px; line-height: 1.45; font-weight: 700; }
    .warn .en { font-weight: 400; font-size: 16px; margin-top: 8px; }

    /* Drive Mode */
    body.drive-on {
      background: #0B1220;
      color: #F6F1E8;
      padding: calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l));
    }
    .drive-wrap {
      max-width: 480px;
      margin: 0 auto;
      min-height: calc(100dvh - 24px - var(--safe-t) - var(--safe-b));
      display: flex;
      flex-direction: column;
    }
    .drive-step {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      line-height: 1.25;
      padding: 12px 8px 16px;
      flex: 0 0 auto;
    }
    .drive-sub {
      display: block;
      margin-top: 8px;
      font-size: 18px;
      font-weight: 600;
      color: rgba(246,241,232,0.7);
    }
    .drive-hit {
      flex: 1 1 auto;
      min-height: 46vh;
      width: 100%;
      border-radius: 28px;
      background: #C4392D;
      color: #fff;
      font-size: 42px;
      font-weight: 800;
      box-shadow: 0 16px 32px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .drive-hit.paused { background: #1F7A4D; }
    .drive-hit .en { color: rgba(255,255,255,0.85); font-size: 18px; font-weight: 600; }
    .drive-end {
      margin-top: 12px;
      width: 100%;
      min-height: 72px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .drive-end .en { color: rgba(255,255,255,0.75); }
    .sr-file {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .ocr-bar {
      height: 14px;
      background: #EEE8DC;
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0 16px;
    }
    .ocr-bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--navy), var(--navy-2));
      border-radius: 99px;
      width: 0;
      transition: width 0.2s ease;
    }
    .thumb-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 0 14px;
    }
    .thumb-row img, .evt-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      background: #EEE8DC;
      flex: 0 0 auto;
    }
    .event-item, .event-edit, .announce-all {
      background: #F7F3EB;
      border-radius: 16px;
      padding: 14px;
      margin: 0 0 12px;
    }
    .event-item-top, .event-edit-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .event-item-top strong, .event-edit-top strong {
      display: block;
      font-size: 18px;
      font-weight: 800;
    }
    .event-item .meta { color: var(--muted); font-size: 14px; font-weight: 650; }
    .event-script {
      font-size: 16px;
      line-height: 1.45;
      margin: 8px 0 12px;
      font-weight: 600;
    }
    .event-edit label {
      display: block;
      font-size: 14px;
      font-weight: 750;
      color: var(--navy);
      margin: 0 0 10px;
    }
    .field, input.field {
      width: 100%;
      min-height: 52px;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 17px;
      background: #fff;
      color: var(--ink);
      margin-top: 4px;
    }
    .event-edit-top .ghost {
      margin-left: auto;
      min-height: 44px;
      font-size: 16px;
    }
    .event-item .row-3 .btn, .announce-all .row-2 .btn, .event-item .btn {
      min-height: 56px;
      font-size: 16px;
      margin: 0;
    }
    .wrap-chips { flex-wrap: wrap; }
    .wrap-chips .chip { flex: 1 1 30%; min-height: 48px; font-size: 15px; }
    .field-script, textarea.field-script {
      min-height: 140px;
      font-size: 16px;
      line-height: 1.4;
      width: 100%;
    }
    .shout-list { list-style: none; padding: 0; margin: 0 0 12px; }
    .shout-list li {
      background: #F7F3EB;
      border-radius: 12px;
      padding: 10px 12px;
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shout-list .tiny-x {
      margin-left: auto;
      min-height: 40px;
      min-width: 40px;
      padding: 0;
    }
    label { display: block; font-size: 14px; font-weight: 750; color: var(--navy); margin: 0 0 10px; }
    .font-stack-fix { }

  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <input id="evt-camera" class="sr-file" type="file" accept="image/*" capture="environment" multiple>
  <input id="evt-upload" class="sr-file" type="file" accept="image/*,application/pdf" multiple>
  <script>

    const STORAGE_KEY = "psc-v1";
    const INSTALL_KEY = "psc-install-hint-dismissed";
    const DRIVE_NOTICE_KEY = "psc-drive-notice-ok";
    const FILLER_RE = /\b(um+|uh+|er+|ah+|like|you know|actually|basically|so)\b/gi;
    const TARGET_WPM_LO = 130;
    const TARGET_WPM_HI = 160;

    const LESSONS = [
      {
        id: "d1",
        title: "Structure: open, 3 points, close",
        body: "Every strong start-up has three parts. Open with a short welcome. Then say only three things—safety, today's plan, and quality or a shout-out. Close with one clear line: Any questions? I'll be on the floor. Let's go!",
        tip: "Use the shape: welcome, three points, close. Don't add a fourth main point.",
        drill: "afe"
      },
      {
        id: "d2",
        title: "Nerves and breath",
        body: "Nerves are normal. Before you speak, do box breathing: in for 4, hold 4, out 4, hold 4. Two rounds steady your voice.",
        tip: "Before you speak, take one slow box breath. Then start with a short welcome.",
        drill: "breathe"

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }
    function daysBetween(a, b) {
      const pa = a.split("-").map(Number);
      const pb = b.split("-").map(Number);
      const da = new Date(pa[0], pa[1] - 1, pa[2]);
      const db = new Date(pb[0], pb[1] - 1, pb[2]);
      return Math.round((db - da) / 86400000);
    }
    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function currentDayIndex() {

    function isIOS() {
      const ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return true;
      return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    }
    function isStandalone() {
      return window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;
    }
    function isSafari() {
      const ua = navigator.userAgent || "";
      if (/CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|DuckDuckGo|YaBrowser/.test(ua)) return false;
      return /Safari/.test(ua) && /Version\//.test(ua);
    }

    function preferVoice() {
      try {
        const list = speechSynthesis.getVoices() || [];
        const tests = [
          (v) => /en-US/i.test(v.lang) && /Samantha|Aaron|Nicky|Susan|Tom|Allison|Ava|Zoe|Evan|Nathan/.test(v.name),
          (v) => /en-US/i.test(v.lang) && /Google/.test(v.name),
          (v) => /en-US|en_US/i.test(v.lang),
          (v) => /^en/i.test(v.lang) && /US|United States|American/.test(v.name + " " + v.lang),
          (v) => /^en/i.test(v.lang)
        ];
        for (const t of tests) {
          const found = list.find(t);
          if (found) return found;
        }
      } catch (e) {}
      return null;
    }

      try { speechSynthesis.cancel(); } catch (e) {}

      if (themeMeta) themeMeta.setAttribute("content", color);
    }

    function pickMime() {
      const types = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/aac"];
      return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    }
    function clearRecording() {
      if (recPlayer) { try { recPlayer.pause(); } catch (e) {} recPlayer = null; }
      if (recUrl) { URL.revokeObjectURL(recUrl); recUrl = ""; }
      recChunks = [];
    }
    async function toggleRecord() {
      errorMsg = "";
      if (recording) {
        try { if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop(); } catch (e) {}
        recording = false;
        render();
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        errorMsg = "Recording is not supported in this browser.";
        render();
        return;
      }
      try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = pickMime();
        recChunks = [];
        mediaRecorder = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          if (recStream) recStream.getTracks().forEach((t) => t.stop());
          recStream = null;
          if (recUrl) URL.revokeObjectURL(recUrl);
          const type = (mediaRecorder && mediaRecorder.mimeType) || mime || "audio/webm";
          if (recChunks.length) recUrl = URL.createObjectURL(new Blob(recChunks, { type: type }));
          recording = false;
          render();
        };
        mediaRecorder.start();
        recording = true;
        render();
      } catch (err) {
        errorMsg = "Couldn't open the mic. Allow the microphone in Settings.";
        recording = false;
        render();
      }
    }
    function playMe() {
      if (!recUrl) return;
      if (recPlayer) { try { recPlayer.pause(); } catch (e) {} }
      recPlayer = new Audio(recUrl);
      recPlayer.play().catch(() => {});
    }

    function SpeechRec() {
      return window.SpeechRecognition || window.webkitSpeechRecognition || null;
    }
    function stopRecognition() {
      if (!recognition) return;
      try { recognition.onresult = null; recognition.onerror = null; recognition.onend = null; recognition.stop(); } catch (e) {}
      recognition = null;
    }
    function startRecognition(onUpdate) {
      const Ctor = SpeechRec();
      if (!Ctor) return false;
      stopRecognition();
      liveTranscript = "";
      finalTranscript = "";
      speechEvents = [];
      lastSpeechAt = 0;
      try {
        recognition = new Ctor();
        recognition.lang = "en-US";
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;
        recognition.onresult = (ev) => {
          let interim = "";
          let fin = finalTranscript;
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const t = ev.results[i][0].transcript || "";
            if (ev.results[i].isFinal) fin += t + " ";
            else interim += t;
          }
          finalTranscript = fin;
          liveTranscript = (fin + " " + interim).replace(/\s+/g, " ").trim();
          lastSpeechAt = Date.now();
          speechEvents.push({ t: lastSpeechAt, text: liveTranscript });
          if (onUpdate) onUpdate();
        };
        recognition.onspeechstart = () => { lastSpeechAt = Date.now(); };
        recognition.onerror = () => {};
        recognition.onend = () => {
          const keep = running || (drive && drive.running && !drive.paused);
          if (keep && recognition) {
            try { recognition.start(); } catch (e) {}
          }
        };
        recognition.start();
        return true;
      } catch (e) {
        recognition = null;
        return false;
      }
    }

    function countFillers(text) {
      if (!text) return { count: 0, list: [] };
      const list = [];
      const re = new RegExp(FILLER_RE.source, "gi");
      let m;
      while ((m = re.exec(text))) list.push(m[0].toLowerCase().replace(/um+/, "um").replace(/uh+/, "uh").replace(/ah+/, "uh").replace(/er+/, "uh"));
      return { count: list.length, list: list };
    }
    function wordCount(text) {
      return (text || "").trim().split(/\s+/).filter(Boolean).length;
    }
    function longestPause(events, start, end) {
      if (!events.length) return 0;
      let longest = 0;
      let prev = start || events[0].t;
      for (const ev of events) {
        const gap = (ev.t - prev) / 1000;
        if (gap > longest) longest = gap;
        prev = ev.t;
      }
      if (end && prev) {
        const tail = (end - prev) / 1000;
        if (tail > 1 && tail < 8 && tail > longest) longest = tail;
      }
      return longest;
    }
    function computeStats() {
      const end = speakEndedAt || Date.now();
      const start = speakStartedAt || end;
      let duration = Math.max(0, (end - start) / 1000);
      if (speechEvents.length) {
        const first = speechEvents[0].t;
        const last = speechEvents[speechEvents.length - 1].t;
        const spoken = Math.max(0, (last - first) / 1000);
        if (spoken > 1) duration = Math.max(spoken, duration * 0.5);
      }
      const text = (finalTranscript || liveTranscript || "").trim();
      const words = wordCount(text);
      const fillers = countFillers(text);
      const minutes = duration / 60;
      const wpm = minutes > 0 && words > 0 ? Math.round(words / minutes) : 0;
      const pause = longestPause(speechEvents, start, end);
      return {
        duration: duration,
        words: words,
        wpm: wpm,
        fillers: fillers.count,
        fillerList: fillers.list,
        pause: pause,
        transcript: text,
        hasSpeech: words > 0
      };
    }

    const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
    const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
    function numWords(n) {
      n = Math.round(Math.abs(Number(n) || 0));
      if (n < 20) return ONES[n];
      if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? " " + ONES[n % 10] : "");
      if (n < 1000) {
        const rest = n % 100;
        return ONES[Math.floor(n / 100)] + " hundred" + (rest ? " " + numWords(rest) : "");
      }
      return String(n);
    }
    function pacePhrase(wpm) {
      if (!wpm) return "I could not measure your pace.";
      if (wpm < 110) return "Your pace was a little slow, about " + numWords(wpm) + " words a minute. That's okay if you stay clear.";
      if (wpm < TARGET_WPM_LO) return "Your pace was a bit under the target, about " + numWords(wpm) + " words a minute.";
      if (wpm <= TARGET_WPM_HI) return "Your pace was right on target, about " + numWords(wpm) + " words a minute.";
      if (wpm <= 180) return "Your pace was a little fast, about " + numWords(wpm) + " words a minute. Try a pause.";
      return "Your pace was quite fast, about " + numWords(wpm) + " words a minute. Slow down and pause.";
    }
    function feedbackSpeech(st) {
      if (!st || !st.hasSpeech) {
        return "Time's up. I couldn't transcribe the words this time, but you showed up and finished the drill. Nice work. The next one is coming.";
      }
      const sec = Math.max(1, Math.round(st.duration));
      let msg = "You spoke for " + numWords(sec) + " second" + (sec === 1 ? "" : "s") + ". ";
      if (st.fillers === 0) msg += "I heard no filler words. ";
      else if (st.fillers === 1) msg += "I heard one filler word. ";
      else msg += "I heard " + numWords(st.fillers) + " filler words. ";
      msg += pacePhrase(st.wpm) + " Nice work.";
      return msg;
    }

    function newId(prefix) {
      return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function seedHash(s) {
      let h = 0;
      const str = String(s || "");
      for (let i = 0; i < str.length; i++) h = ((h << 5) - h) + str.charCodeAt(i) | 0;
      return Math.abs(h);
    }
    function pickSeeded(arr, seed) {
      if (!arr || !arr.length) return "";
      return arr[seedHash(seed) % arr.length];
    }
    function emptyEvent(partial) {
      return Object.assign({
        id: newId("e_"),

    function addDays(iso, n) {
      const p = iso.split("-").map(Number);
      const d = new Date(p[0], p[1] - 1, p[2]);
      d.setDate(d.getDate() + n);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function monthPrefix(iso) {
      return (iso || todayStr()).slice(0, 7);
    }
    function monthLabel(ym) {
      const p = (ym || "").split("-").map(Number);
      if (p.length < 2) return ym;
      const d = new Date(p[0], p[1] - 1, 1);
      return d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    }
    function upcomingEvents() {
      const today = todayStr();
      const end = addDays(today, UPCOMING_DAYS);
      return (state.events || [])
        .filter((e) => e.date && e.date >= today && e.date <= end)
        .sort((a, b) => (a.date + " " + (a.time || "99:99")).localeCompare(b.date + " " + (b.time || "99:99")));
    }
    function todaysEvents() {
      const today = todayStr();
      return upcomingEvents().filter((e) => e.date === today);
    }
    function comingUpEvents() {
      const today = todayStr();
      const start = addDays(today, 1);
      const end = addDays(today, 5);
      return upcomingEvents().filter((e) => e.date >= start && e.date <= end);
    }
    function formatPrettyDate(iso) {
      if (!iso) return "";
      const p = iso.split("-").map(Number);
      const d = new Date(p[0], p[1] - 1, p[2]);
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    }
    function formatPrettyTime(hhmm) {
      if (!hhmm) return "";
      const parts = hhmm.split(":");
      let h = Number(parts[0]);
      const m = parts[1] || "00";
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;
      return m === "00" ? (h + " " + ampm) : (h + ":" + m + " " + ampm);
    }
    function formatWhen(ev) {
      const today = todayStr();
      const tomorrow = addDays(today, 1);
      const timeBit = ev.time ? " at " + formatPrettyTime(ev.time) : "";
      if (ev.date === today) return "today" + timeBit;
      if (ev.date === tomorrow) return "tomorrow" + timeBit;
      if (!ev.date) return ev.time ? "at " + formatPrettyTime(ev.time) : "";
      const p = ev.date.split("-").map(Number);
      const d = new Date(p[0], p[1] - 1, p[2]);
      return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }) + timeBit;
    }
    function locationPhrase(loc) {
      if (!loc) return "";
      const t = loc.trim();
      if (/^(in|at|on)\b/i.test(t)) return " " + t;
      return " at " + t;
    }
    function eventWhy(ev, seed) {
      const key = ev.type && SCRIPT_WHYS[ev.type] ? ev.type : "event";
      return pickSeeded(SCRIPT_WHYS[key], seed + "-why-" + (ev.id || ev.title));
    }

    function autoEventScript(ev) {
      const seed = (ev.id || ev.title) + "|" + (ev.date || "") + "|" + todayStr();
      const hook = pickSeeded(SCRIPT_OPENERS, seed + "-open");
      const title = (ev.title || "something for our team").replace(/\.$/, "");
      const when = formatWhen(ev);
      const loc = locationPhrase(ev.location);
      const whenBit = when ? " " + when : "";
      const lines = [
        hook,
        "We have " + title + whenBit + loc + ".",
        eventWhy(ev, seed)
      ];
      if (ev.notes) lines.push(ev.notes.replace(/\.$/, "") + ".");
      lines.push(pickSeeded(SCRIPT_CTAS, seed + "-cta"));
      lines.push(pickSeeded(SCRIPT_CLOSERS, seed + "-close"));
      return lines.join(" ").replace(/\s+/g, " ").trim();
    }
    function getEventScript(ev) {
      if (ev && ev.scriptCustom && ev.scriptCustom.trim()) return ev.scriptCustom.trim();
      return autoEventScript(ev);
    }

    function todaysShoutouts() {

      return (state.shoutouts || []).filter((s) => !s.date || s.date === today);

    function shoutoutSentences(seed) {
      const list = todaysShoutouts();
      if (!list.length) return "";
      const bits = list.map((s) => {
        const name = (s.name || "a teammate").trim();
        const reason = (s.reason || "showing up for the team").trim();
        return pickSeeded([
          "I want to give a shout-out to " + name + " for " + reason + ".",
          "Please join me in recognizing " + name + " — " + reason + ".",
          "A genuine thank-you to " + name + " for " + reason + "."
        ], seed + name);
      });
      return bits.join(" ") + " That's the kind of teammate we need, and I want us to keep noticing it.";
    }
    function personalTouchSentence(seed) {
      const custom = (state.personalTouch || "").trim();
      if (custom) return custom.replace(/\.$/, "") + ".";
      if (state.includePrompt === false) return "";
      const prompt = pickSeeded(CONNECTION_PROMPTS, todayStr() + "-prompt");
      return "One more thing, just to stay connected: " + prompt.replace(/^Ask:\s*/i, "Can I ask — ").replace(/\?$/, "") + "?";
    }
    function teaserSentence(seed) {
      const upcoming = comingUpEvents();
      if (!upcoming.length) return "";
      const bits = upcoming.slice(0, 3).map((ev) => {
        const title = (ev.title || "an event").replace(/\.$/, "");
        return title + " " + formatWhen(ev) + locationPhrase(ev.location);
      });
      const lead = pickSeeded([
        "Coming up in the next few days, I don't want us to miss this:",
        "Looking ahead, here's what's coming for us:",
        "And a quick heads-up on what's around the corner for our team:"
      ], seed + "-tease");
      return lead + " " + bits.join("; ") + ".";
    }

    function dailyAnnouncementScript() {
      const today = todaysEvents();
      const seed = todayStr() + "|daily|" + today.map((e) => e.id).join(",");
      const parts = [pickSeeded(SCRIPT_OPENERS, seed + "-open")];
      if (today.length) {
        today.forEach((ev, i) => {
          const title = (ev.title || "something for our team").replace(/\.$/, "");
          const when = ev.time ? " at " + formatPrettyTime(ev.time) : "";
          const loc = locationPhrase(ev.location);
          const lead = i === 0 ? "Today" : "Also today";
          parts.push(lead + when + ", we have " + title + loc + ".");
          parts.push(eventWhy(ev, seed + i));
          if (ev.notes) parts.push(ev.notes.replace(/\.$/, "") + ".");
        });
        parts.push(pickSeeded(SCRIPT_CTAS, seed + "-cta"));
      } else if (comingUpEvents().length) {
        parts.push("I don't have a big event for us today, but I do want you to hear what's coming.");
      } else {
        parts.push("Even without a posted event, I want us to start this shift connected.");
      }
      const shouts = shoutoutSentences(seed);
      if (shouts) parts.push(shouts);
      const tease = teaserSentence(seed);
      if (tease) parts.push(tease);
      const touch = personalTouchSentence(seed);
      if (touch) parts.push(touch);
      parts.push(pickSeeded(SCRIPT_CLOSERS, seed + "-close"));
      let text = parts.join(" ").replace(/\s+/g, " ").trim();
      let words = wordCount(text);
      if (words < 50) {
        text += " I know this job is hard, and I don't take your effort for granted. Let's look out for one another today.";
        words = wordCount(text);
      }
      if (words > 105) {
        const trimmed = parts.filter((p, i) => i === 0 || !SCRIPT_WHYS.event.includes(p) || i < 4);
        const shorter = [parts[0]].concat(parts.slice(1, 3));
        if (shouts) shorter.push(shouts);
        if (tease) shorter.push(tease);
        shorter.push(pickSeeded(SCRIPT_CLOSERS, seed + "-close"));
        const alt = shorter.join(" ").replace(/\s+/g, " ").trim();
        if (wordCount(alt) >= 45) text = alt;
      }
      return text;
    }

    function idbOpen() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error("no idb"));
        const req = indexedDB.open(PHOTO_DB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE, { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function idbPut(record) {
      return idbOpen().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(PHOTO_STORE, "readwrite");
        tx.objectStore(PHOTO_STORE).put(record);
        tx.oncomplete = () => resolve(record);
        tx.onerror = () => reject(tx.error);
      }));
    }
    function idbGet(id) {
      return idbOpen().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(PHOTO_STORE, "readonly");
        const req = tx.objectStore(PHOTO_STORE).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      }));
    }
    async function hydrateEventThumbs() {
      const imgs = document.querySelectorAll("img[data-photo]");
      for (const img of imgs) {
        const id = img.getAttribute("data-photo");
        if (!id) continue;
        if (photoUrlCache[id]) { img.src = photoUrlCache[id]; continue; }
        try {
          const rec = await idbGet(id);
          const blob = rec && (rec.thumb || rec.blob);
          if (!blob) continue;
          const url = URL.createObjectURL(blob);
          photoUrlCache[id] = url;
          img.src = url;
        } catch (e) {}
      }
    }
    function isPdfFile(file) {
      return (file && file.type === "application/pdf") || /\.pdf$/i.test((file && file.name) || "");
    }
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }
    async function compressImage(file, maxW, quality) {
      try {
        const url = URL.createObjectURL(file);
        const img = await loadImage(url);
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxW / Math.max(1, img.width));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const blob = await new Promise((resolve) => c.toBlob(resolve, "image/jpeg", quality));
        return blob || file;
      } catch (e) {
        return file;
      }
    }
    function loadTesseract() {
      if (window.Tesseract) return Promise.resolve(window.Tesseract);
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = TESSERACT_SRC;
        s.async = true;
        s.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error("Tesseract missing"));
        s.onerror = () => reject(new Error("Couldn't load the scanner. Check your connection."));
        document.head.appendChild(s);
      });
    }

    const MONTHS = {
      january: 1, february: 2, march: 3, april: 4, may: 5, june: 6,
      july: 7, august: 8, september: 9, october: 10, november: 11, december: 12,
      jan: 1, feb: 2, mar: 3, apr: 4, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12
    };
    const WEEKDAYS = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 };
    function pad2(n) { return String(n).padStart(2, "0"); }
    function isoFromParts(year, month, day) {
      return year + "-" + pad2(month) + "-" + pad2(day);
    }
    function nextWeekday(now, target) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diff = (target - d.getDay() + 7) % 7;
      d.setDate(d.getDate() + diff);
      return isoFromParts(d.getFullYear(), d.getMonth() + 1, d.getDate());
    }
    function inferBulletinPeriod(text, events, now) {
      now = now || new Date();
      let year = now.getFullYear();
      let month = now.getMonth() + 1;
      const header = String(text || "").match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+(\d{4})\b/i);
      if (header) {
        month = MONTHS[header[1].toLowerCase()] || month;
        year = Number(header[2]) || year;
      }
      const dated = (events || []).filter((e) => e.date);
      if (dated.length) {
        const counts = {};
        dated.forEach((e) => {
          const key = e.date.slice(0, 7);
          counts[key] = (counts[key] || 0) + 1;
        });
        let best = "", n = 0;
        Object.keys(counts).forEach((k) => { if (counts[k] > n) { n = counts[k]; best = k; } });
        if (best) {
          year = Number(best.slice(0, 4));
          month = Number(best.slice(5, 7));
        }
      }
      return { year: year, month: month, ym: year + "-" + pad2(month) };
    }
    function extractDateTime(line, now, inferred) {
      let rest = line;
      let date = "";
      let time = "";
      const today = todayStr();
      const yearNow = (inferred && inferred.year) || now.getFullYear();
      const monthNow = (inferred && inferred.month) || (now.getMonth() + 1);

      const todayRe = /\b(today|tomorrow)\b/i;
      const tm = rest.match(todayRe);
      if (tm) {
        date = tm[1].toLowerCase() === "today" ? today : addDays(today, 1);
        rest = rest.replace(todayRe, " ");
      }
      const mdY = rest.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?\b/i);
      if (mdY) {
        const month = MONTHS[mdY[1].toLowerCase().replace(/\.$/, "")];
        const day = Number(mdY[2]);
        const year = mdY[3] ? Number(mdY[3]) : yearNow;
        if (month) date = isoFromParts(year, month, day);
        rest = rest.replace(mdY[0], " ");
      } else {
        const dMonth = rest.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\.?(?:,?\s*(\d{4}))?\b/i);
        if (dMonth) {
          const month = MONTHS[dMonth[2].toLowerCase().replace(/\.$/, "")];
          const day = Number(dMonth[1]);
          const year = dMonth[3] ? Number(dMonth[3]) : yearNow;
          if (month) date = isoFromParts(year, month, day);
          rest = rest.replace(dMonth[0], " ");
        }
      }
      const slash = rest.match(/\b(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b/);
      if (slash && !date) {
        const a = Number(slash[1]);
        const b = Number(slash[2]);
        let year = slash[3] ? Number(slash[3]) : yearNow;
        if (year < 100) year += 2000;
        if (a >= 1 && a <= 12 && b >= 1 && b <= 31) date = isoFromParts(year, a, b);
        rest = rest.replace(slash[0], " ");
      }
      if (!date) {
        const dayOnly = rest.match(/\b(\d{1,2})(?:st|nd|rd|th)\b/);
        if (dayOnly && Number(dayOnly[1]) >= 1 && Number(dayOnly[1]) <= 31) {
          date = isoFromParts(yearNow, monthNow, Number(dayOnly[1]));
          rest = rest.replace(dayOnly[0], " ");
        }
      }
      if (!date) {
        const wd = rest.match(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i);
        if (wd) {
          date = nextWeekday(now, WEEKDAYS[wd[1].toLowerCase()]);
          rest = rest.replace(wd[0], " ");
        }
      }
      const t12 = rest.match(/\b(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)\b/i);
      if (t12) {
        let h = Number(t12[1]);
        const m = t12[2] || "00";
        const ap = t12[3].toLowerCase().replace(/\./g, "");
        if (ap === "pm" && h < 12) h += 12;
        if (ap === "am" && h === 12) h = 0;
        time = pad2(h) + ":" + m;
        rest = rest.replace(t12[0], " ");
      } else {
        const t24 = rest.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
        if (t24) {
          time = pad2(Number(t24[1])) + ":" + t24[2];
          rest = rest.replace(t24[0], " ");
        }
      }
      rest = rest.replace(/^[ \t,;:|–—\-]+|[ \t,;:|–—\-]+$/g, "").replace(/\s+/g, " ").trim();
      return { date: date, time: time, rest: rest };
    }
    function extractLocation(text) {
      if (!text) return "";
      const m = text.match(/\b(?:in|at|on)\s+(?:the\s+)?(.{3,60})$/i);
      if (m) return m[0].trim();
      const known = text.match(/\b(break\s*room|breakroom|cafeteria|conference room|training room|parking lot|lobby|meeting room|wellness room)\b/i);
      return known ? known[0] : "";
    }
    function parseBulletinText(text, now, inferred) {
      now = now || new Date();
      const lines = String(text || "").replace(/\r/g, "").split("\n").map((s) => s.trim());
      const period = inferred || inferBulletinPeriod(text, [], now);
      const events = [];
      let current = null;
      const flush = () => {
        if (current && (current.title || current.date || current.time)) events.push(current);
        current = null;
      };
      for (const line of lines) {
        if (!line) continue;
        const parsed = extractDateTime(line, now, period);
        if (parsed.date || parsed.time) {
          if (current && ((parsed.date && current.date && parsed.date !== current.date) || (parsed.time && current.time && current.title))) flush();
          if (!current) current = emptyEvent({ source: "scan", type: "event" });
          if (parsed.date) current.date = parsed.date;
          if (parsed.time) current.time = parsed.time;
          if (parsed.rest) {
            const loc = extractLocation(parsed.rest);
            if (!current.title) current.title = parsed.rest;
            else if (loc && !current.location) current.location = loc;
            else current.notes = [current.notes, parsed.rest].filter(Boolean).join(" ");
          }
        } else if (current) {
          const loc = extractLocation(line);
          if (loc && !current.location) current.location = loc;
          else if (!current.title) current.title = line;
          else current.notes = [current.notes, line].filter(Boolean).join(" ");
        } else {
          current = emptyEvent({ source: "scan", type: "event", title: line });
        }
      }
      flush();
      return events.filter((e) => (e.title && e.title.length > 1) || e.date);
    }
    function eventDedupeKey(ev) {
      const title = (ev.title || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
      return title + "|" + (ev.date || "") + "|" + (ev.time || "");
    }
    function dedupeEvents(list) {
      const seen = {};
      const out = [];
      (list || []).forEach((e) => {
        const k = eventDedupeKey(e);
        if (!k || k === "||") { out.push(e); return; }
        if (seen[k]) return;
        seen[k] = true;
        out.push(e);
      });
      return out;
    }

    function speakText(text) {
      if (!text) return;
      stopSpeech();
      try {
        const u = new SpeechSynthesisUtterance(text);

        if (voice) u.voice = voice;
        u.rate = 0.95;
        speechSynthesis.speak(u);

    }
    function practiceAnnouncement(script) {

    function openEventReview(filterId) {

        .filter((e) => e.date && e.date >= todayStr())

      if (filterId) {

        if (hit && !eventDrafts.some((e) => e.id === filterId)) eventDrafts.unshift(Object.assign({}, hit));

    function openAddForm(editId) {

      addForm = ev ? Object.assign({}, ev) : emptyEvent({ date: todayStr(), source: "manual", type: "event" });

    function monthHasScanned(ym) {

    async function processBulletinFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      const pdfs = files.filter(isPdfFile);
      const images = files.filter((f) => !isPdfFile(f));
      let warning = "";
      if (pdfs.length && !images.length) {
        warning = "PDFs can't be read here. Please upload a photo or screenshot of the bulletin instead.";
        scanProgress = { pct: 1, label: "PDF not supported", thumbs: [], warning: warning };
        eventDrafts = [];
        bulletinMonth = todayStr().slice(0, 7);
        bulletinReplace = true;
        screen = "events-confirm";
        render();
        return;
      }
      if (pdfs.length) warning = "A PDF was skipped. Please upload a photo or screenshot of the bulletin instead.";

      screen = "events-scan";
      scanProgress = { pct: 0, label: "Preparing photos…", thumbs: [], warning: warning };
      render();

      const stored = [];
      const previewUrls = [];
      for (const file of images) {
        const blob = await compressImage(file, 1600, 0.72);
        const thumb = await compressImage(file, 240, 0.7);
        const rec = { id: newId("p_"), blob: blob, thumb: thumb, created: Date.now(), name: file.name || "" };
        try { await idbPut(rec); } catch (e) {}
        stored.push(rec);
        if (thumb) previewUrls.push(URL.createObjectURL(thumb));
      }
      scanProgress.thumbs = previewUrls;
      render();

      let text = "";
      let ocrFailed = false;
      if (stored.length) {
        try {
          scanProgress.label = "Loading the scanner…";
          scanProgress.pct = 0.05;
          render();
          const Tesseract = await loadTesseract();
          const worker = await Tesseract.createWorker("eng", 1, {
            logger: (m) => {
              if (m && m.status === "recognizing text") {
                scanProgress.pct = 0.1 + 0.85 * (m.progress || 0);
              }
            }
          });
          const pieces = [];
          for (let i = 0; i < stored.length; i++) {
            scanProgress.label = "Reading photo " + (i + 1) + " of " + stored.length + "…";
            render();
            const result = await worker.recognize(stored[i].blob || stored[i].thumb);
            if (result && result.data && result.data.text) pieces.push(result.data.text);
          }
          await worker.terminate();
          text = pieces.join("\n\n");
        } catch (err) {
          ocrFailed = true;
          warning = (warning ? warning + " " : "") + "Couldn't read the text automatically. You can add events yourself, or edit what we found, while looking at the photo.";
        }
      }

      const period = inferBulletinPeriod(text, [], new Date());
      let parsed = parseBulletinText(text, new Date(), period);
      parsed = dedupeEvents(parsed);
      const photoIds = stored.map((r) => r.id);
      parsed.forEach((ev) => {
        ev.source = "scan";
        ev.type = ev.type || "event";
        ev.photoIds = photoIds.slice();
        if (!ev.date) ev.date = period.ym + "-01";
      });
      eventDrafts = parsed;
      bulletinMonth = period.ym;
      bulletinReplace = true;
      scanProgress.pct = 1;
      scanProgress.label = ocrFailed ? "Add or fix the events, then tap Looks good." : "Check what we found";
      scanProgress.warning = warning;
      screen = "events-confirm";
      render();
    }

    function applyBulletinSave() {
      const ym = bulletinMonth || todayStr().slice(0, 7);
      const incoming = dedupeEvents((eventDrafts || []).filter((e) => (e.title && e.title.trim()) || e.date).map((e) => {
        const copy = Object.assign({}, e);
        copy.source = copy.source || "scan";
        return copy;
      }));
      const manualKeep = (state.events || []).filter((e) => e.source === "manual");
      const otherMonths = (state.events || []).filter((e) => e.source !== "manual" && !(e.date && e.date.startsWith(ym)));
      let scannedThisMonth = (state.events || []).filter((e) => e.source === "scan" && e.date && e.date.startsWith(ym));
      if (bulletinReplace) scannedThisMonth = [];
      const merged = dedupeEvents(manualKeep.concat(otherMonths).concat(scannedThisMonth).concat(incoming));
      state.events = merged;
      saveState();
      scanProgress.warning = "";
      screen = "home";
      render();
    }

    function chartSvg() {
      const rows = recentSessions(12);
      if (rows.length < 2) {
        return `<p class="tiny" style="margin-top:8px">A simple WPM and filler trend appears after a few scored sessions.</p>`;
      }
      const w = 320, h = 110, p = 8;
      const wpmMax = Math.max(200, ...rows.map((r) => r.wpm || 0));
      const filMax = Math.max(6, ...rows.map((r) => r.fillers || 0));
      function pts(key, max) {
        return rows.map((r, i) => {
          const x = p + (i * (w - p * 2)) / (rows.length - 1);
          const val = r[key] == null ? 0 : r[key];
          const y = h - p - (val / max) * (h - p * 2);
          return x.toFixed(1) + "," + y.toFixed(1);
        }).join(" ");
      }
      return `<div class="chart-wrap" aria-hidden="true">
        <svg viewBox="0 0 ${w} ${h}" role="img">
          <line x1="${p}" y1="${(h-p) - ((145/wpmMax)*(h-p*2))}" x2="${w-p}" y2="${(h-p) - ((145/wpmMax)*(h-p*2))}" stroke="#E6DFD2" stroke-width="1" stroke-dasharray="4 4"/>
          <polyline fill="none" stroke="#0F2F59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts("wpm", wpmMax)}"/>
          <polyline fill="none" stroke="#C8962E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts("fillers", filMax)}"/>
        </svg>
        <div class="chart-legend"><span><i class="dot-navy"></i>WPM</span><span><i class="dot-gold"></i>Fillers</span></div>
      </div>`;
    }

    function scriptSections(text) {
      const raw = (text || "").trim();
      if (!raw) return [];
      let parts = raw.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean);
      if (parts.length <= 1) {
        const sentences = raw.split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter(Boolean);
        if (sentences.length) {
          parts = [];
          for (let i = 0; i < sentences.length; i += 2) {
            parts.push(sentences.slice(i, i + 2).join(" "));
          }
        } else {
          parts = [raw];
        }
      }
      return parts;
    }

    function pickPrompt(kind, preferredId) {
      if (kind === "myscript") {
        const sections = scriptSections(state.myScript);
        const text = sections.length
          ? state.myScript
          : "Good morning, AFE. Safety first today. Then I'll share the plan and close strong.";
        return {
          id: "myscript",
          kind: "myscript",
          title: "My start-up",
          text: sections.length ? "Read your script from the teleprompter. Speak it out loud." : text,
          hint: sections.length ? "Your script will scroll on the screen." : "Write your script first, or use this sample."
        };
      }
      const pool = kind === "impromptu" ? IMPROMPTU : AFE_PROMPTS;
      if (preferredId) {
        const found = pool.find((p) => p.id === preferredId);
        if (found) return found;
      }
      let list = pool;
      if (kind === "afe3") {
        const full = AFE_PROMPTS.find((p) => p.id === "full-startup");
        if (full) return full;
      }
      return list[Math.floor(Math.random() * list.length)];
    }

    function stopTimer() {
      if (timerId) { clearInterval(timerId); timerId = 0; }
      running = false;
      stopRecognition();
      stopPrompter();
      if (speakStartedAt && !speakEndedAt) speakEndedAt = Date.now();
    }
    function startTimer() {
      stopTimer();
      clearLiveStats();
      remaining = practiceSecs;
      running = true;
      speakStartedAt = Date.now();
      speakEndedAt = 0;
      stats = null;
      liveTranscript = "";
      finalTranscript = "";
      startRecognition(() => {
        if (screen === "practice") {
          const el = document.querySelector(".transcript");
          if (el) el.textContent = liveTranscript;
        }
      });
      if (practiceKind === "myscript" || practiceKind === "announce") startPrompter();
      render();
      timerId = setInterval(() => {
        if (!running) return;
        remaining = Math.max(0, remaining - 0.2);
        const tEl = document.querySelector(".timer");
        if (tEl) {
          tEl.textContent = formatTime(remaining);
          tEl.classList.toggle("hot", remaining <= 5);
        }
        if (remaining <= 0) finishTimer();
      }, 200);
    }
    function finishTimer() {
      stopTimer();
      remaining = 0;
      speakEndedAt = Date.now();
      if (srSupported) stats = computeStats();
      render();
    }
    function clearLiveStats() {
      liveTranscript = "";
      finalTranscript = "";
      speechEvents = [];
      stats = null;
    }

    function startPrompter() {
      stopPrompter();
      prompterOn = true;
      prompterOffset = 0;
      let last = performance.now();
      const tick = (now) => {
        if (!prompterOn) return;
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        prompterOffset += (state.scrollSpeed || 40) * dt;
        const track = document.getElementById("prompter-track");
        const box = document.getElementById("prompter");
        if (track && box) {
          const max = Math.max(0, track.scrollHeight - box.clientHeight);
          if (prompterOffset > max) prompterOffset = max;
          track.style.transform = "translateY(-" + prompterOffset + "px)";
          const mid = box.clientHeight / 2;
          const ps = track.querySelectorAll("p");
          ps.forEach((p) => {
            const r = p.getBoundingClientRect();
            const br = box.getBoundingClientRect();
            const cy = r.top + r.height / 2 - br.top;
            p.classList.toggle("on", Math.abs(cy - mid) < r.height);
          });
        }
        prompterRaf = requestAnimationFrame(tick);
      };
      prompterRaf = requestAnimationFrame(tick);
    }
    function stopPrompter() {
      prompterOn = false;
      if (prompterRaf) cancelAnimationFrame(prompterRaf);
      prompterRaf = 0;
    }

    function openPractice(kind, secs, fromLesson) {
      announceOverride = "";
      if (kind !== "leadership") lessonTrack = lessonTrack || "core";
      practiceKind = kind === "afe3" ? "afe" : (kind || "afe");

      if (fromLesson && LESSONS[lessonIndex]) {

          practiceKind = "afe";
        } else if (LESSONS[lessonIndex].drill === "myscript") {
          practiceKind = "myscript";
        } else if (LESSONS[lessonIndex].drill === "impromptu") {
          practiceKind = "impromptu";
        } else if (LESSONS[lessonIndex].drill === "breathe") {
          practiceKind = "afe";
        }
      }
      prompt = pickPrompt(kind === "afe3" ? "afe3" : practiceKind);
      remaining = practiceSecs;

      clearLiveStats();
